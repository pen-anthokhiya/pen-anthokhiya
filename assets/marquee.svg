<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Tech stack: Next.js, React, TypeScript, Node.js, PostgreSQL, Prisma, GSAP, Tailwind, MongoDB, Redux">
  <defs>
    <clipPath id="card"><rect width="1200" height="240" rx="28"/></clipPath>
  </defs>
  <style>
    .t { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; letter-spacing: 1px; }
    .left { animation: left 22s linear infinite; }
    .right { animation: right 26s linear infinite; }
    @keyframes left { from { transform: translateX(0); } to { transform: translateX(-2700px); } }
    @keyframes right { from { transform: translateX(-2700px); } to { transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="240" fill="#0a0a0b"/>

    <!-- back ribbon: outlined -->
    <g transform="rotate(3 600 120)">
      <rect x="-100" y="118" width="1400" height="76" fill="#141416"/>
      <g class="right">
        <text class="t" x="0" y="173" fill="none" stroke="#a1a1aa" stroke-width="1.2" textLength="2700" lengthAdjust="spacing">FULL-STACK ✦ MOTION ✦ PERFORMANCE ✦ ACCESSIBILITY ✦ DX ✦ SCALABILITY ✦ CLEAN CODE ✦ </text>
        <text class="t" x="2700" y="173" fill="none" stroke="#a1a1aa" stroke-width="1.2" textLength="2700" lengthAdjust="spacing">FULL-STACK ✦ MOTION ✦ PERFORMANCE ✦ ACCESSIBILITY ✦ DX ✦ SCALABILITY ✦ CLEAN CODE ✦ </text>
      </g>
    </g>

    <!-- front ribbon: solid -->
    <g transform="rotate(-4 600 120)">
      <rect x="-100" y="52" width="1400" height="80" fill="#ff5a1f"/>
      <g class="left">
        <text class="t" x="0" y="109" fill="#0a0a0b" textLength="2700" lengthAdjust="spacing">NEXT.JS ✦ REACT ✦ TYPESCRIPT ✦ NODE.JS ✦ POSTGRESQL ✦ PRISMA ✦ GSAP ✦ TAILWIND ✦ MONGODB ✦ REDUX ✦ </text>
        <text class="t" x="2700" y="109" fill="#0a0a0b" textLength="2700" lengthAdjust="spacing">NEXT.JS ✦ REACT ✦ TYPESCRIPT ✦ NODE.JS ✦ POSTGRESQL ✦ PRISMA ✦ GSAP ✦ TAILWIND ✦ MONGODB ✦ REDUX ✦ </text>
      </g>
    </g>
  </g>
</svg>
