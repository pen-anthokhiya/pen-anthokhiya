<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="What I do: Web Applications, Backend and APIs, Data and Databases, Motion and Interaction">
  <defs>
    <clipPath id="card"><rect width="1200" height="600" rx="28"/></clipPath>
    <clipPath id="title"><rect x="0" y="80" width="1200" height="100"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .serif { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
    .meta { font-size: 13px; letter-spacing: 3px; font-weight: 600; fill: #a1a1aa; }
    .num { font-size: 15px; font-weight: 700; fill: #ff5a1f; letter-spacing: 2px; }
    .name { font-size: 42px; font-weight: 800; fill: #f5f5f4; letter-spacing: -1.5px; }
    .tags { font-size: 16px; fill: #a1a1aa; letter-spacing: 1px; }

    .fade { opacity: 0; animation: fade 1s ease forwards; }
    .rise { transform: translateY(110px); animation: rise 1.2s cubic-bezier(.77,0,.18,1) forwards; }
    .row  { opacity: 0; transform: translateY(30px); animation: row 1s cubic-bezier(.22,1,.36,1) forwards; }
    .draw { stroke-dasharray: 1088; stroke-dashoffset: 1088; animation: draw 1.4s cubic-bezier(.77,0,.18,1) forwards; }
    .scan { opacity: 0; animation: scan 10s cubic-bezier(.77,0,.18,1) 2.6s infinite; }
    .arw  { transform-box: fill-box; transform-origin: center; animation: arw 2.5s ease-in-out infinite; }

    @keyframes fade { to { opacity: 1; } }
    @keyframes rise { to { transform: translateY(0); } }
    @keyframes row { to { opacity: 1; transform: translateY(0); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes arw { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(45deg); } }
    @keyframes scan {
      0%   { opacity: 0; transform: translateY(0); }
      4%   { opacity: 1; transform: translateY(0); }
      22%  { opacity: 1; transform: translateY(0); }
      28%  { opacity: 1; transform: translateY(96px); }
      47%  { opacity: 1; transform: translateY(96px); }
      53%  { opacity: 1; transform: translateY(192px); }
      72%  { opacity: 1; transform: translateY(192px); }
      78%  { opacity: 1; transform: translateY(288px); }
      96%  { opacity: 1; transform: translateY(288px); }
      100% { opacity: 0; transform: translateY(288px); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .fade, .row { opacity: 1; transform: none; } .rise { transform: none; } .draw { stroke-dashoffset: 0; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="600" fill="#0a0a0b"/>

    <text class="sans meta fade" x="56" y="58">( 02 ) — WHAT I DO</text>
    <text class="sans meta fade" x="1144" y="58" text-anchor="end" style="animation-delay:.15s">END-TO-END · DESIGN → DEPLOY</text>

    <g clip-path="url(#title)">
      <text class="rise" x="52" y="160" style="animation-delay:.2s">
        <tspan class="sans" font-size="78" font-weight="800" fill="#f5f5f4" letter-spacing="-3">Selected </tspan><tspan class="serif" font-size="78" fill="#ff5a1f" letter-spacing="-2">expertise</tspan>
      </text>
    </g>

    <!-- inversion highlight that steps through rows -->
    <rect class="scan" x="0" y="214" width="1200" height="96" fill="#ffffff" style="mix-blend-mode: difference"/>

    <line class="draw" x1="56" y1="214" x2="1144" y2="214" stroke="#ffffff" stroke-opacity="0.2" style="animation-delay:.6s"/>

    <g class="sans row" style="animation-delay:.8s">
      <text class="num" x="56" y="270">01</text>
      <text class="name" x="130" y="276">Web Applications</text>
      <text class="tags" x="1080" y="270" text-anchor="end">Next.js · React · TypeScript</text>
      <path class="arw" d="M1108 274 L1128 254 M1112 254 H1128 V270" stroke="#f5f5f4" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
    <line class="draw" x1="56" y1="310" x2="1144" y2="310" stroke="#ffffff" stroke-opacity="0.2" style="animation-delay:.9s"/>

    <g class="sans row" style="animation-delay:.95s">
      <text class="num" x="56" y="366">02</text>
      <text class="name" x="130" y="372">Backend &amp; APIs</text>
      <text class="tags" x="1080" y="366" text-anchor="end">Node.js · Express · Prisma · Inngest</text>
      <path class="arw" d="M1108 370 L1128 350 M1112 350 H1128 V366" stroke="#f5f5f4" stroke-width="2.5" fill="none" stroke-linecap="round" style="animation-delay:.3s"/>
    </g>
    <line class="draw" x1="56" y1="406" x2="1144" y2="406" stroke="#ffffff" stroke-opacity="0.2" style="animation-delay:1.05s"/>

    <g class="sans row" style="animation-delay:1.1s">
      <text class="num" x="56" y="462">03</text>
      <text class="name" x="130" y="468">Data &amp; Databases</text>
      <text class="tags" x="1080" y="462" text-anchor="end">PostgreSQL · MongoDB · Migrations</text>
      <path class="arw" d="M1108 466 L1128 446 M1112 446 H1128 V462" stroke="#f5f5f4" stroke-width="2.5" fill="none" stroke-linecap="round" style="animation-delay:.6s"/>
    </g>
    <line class="draw" x1="56" y1="502" x2="1144" y2="502" stroke="#ffffff" stroke-opacity="0.2" style="animation-delay:1.2s"/>

    <g class="sans row" style="animation-delay:1.25s">
      <text class="num" x="56" y="558">04</text>
      <text class="name" x="130" y="564">Motion &amp; Interaction</text>
      <text class="tags" x="1080" y="558" text-anchor="end">GSAP · Tailwind · shadcn/ui</text>
      <path class="arw" d="M1108 562 L1128 542 M1112 542 H1128 V558" stroke="#f5f5f4" stroke-width="2.5" fill="none" stroke-linecap="round" style="animation-delay:.9s"/>
    </g>
  </g>
</svg>
